<div
    style="
        margin: 0;
        padding: 0;
        width: 100%;
        background-color: #f7efe3;
        font-family: Arial, Helvetica, sans-serif;
        color: #3a2923;
    "
>
    <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px">
        <!-- CONTENEDOR PRINCIPAL -->
        <div
            style="
                background-color: #ffffff;
                border-radius: 14px;
                overflow: hidden;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
            "
        >
            <!-- ENCABEZADO -->
            <div style="background-color: #e8612d; padding: 10px 15px; display: flex; justify-content: center">
                <img
                    src="https://uwmptccyleznngdazgrp.supabase.co/storage/v1/object/public/Fotos/assets/logo-3d-blanco.png"
                    alt="Logo de Cyberia"
                    style="max-width: 180px; height: 100%; max-height: 120px; display: block; margin: 0 auto"
                />
            </div>

            <!-- CONTENIDO -->
            <div style="padding: 35px 30px 30px 30px">
                <p
                    style="
                        margin: 0 0 10px 0;
                        font-family: Georgia, 'Times New Roman', serif;
                        font-size: 28px;
                        line-height: 1.3;
                        font-weight: bold;
                        color: #c1272d;
                    "
                >
                    {{titulo}}
                </p>

                <p
                    style="
                        margin: 0 0 25px 0;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 17px;
                        line-height: 1.6;
                        color: #3a2923;
                    "
                >
                    Hola <strong>{{nombre}}</strong>,
                </p>

                <!-- ESTADO -->
                <div
                    style="
                        margin: 0 0 25px 0;
                        padding: 18px;
                        background-color: #f7efe3;
                        border-left: 5px solid #e8612d;
                        border-radius: 6px;
                    "
                >
                    <p
                        style="
                            margin: 0 0 8px 0;
                            font-family: Arial, Helvetica, sans-serif;
                            font-size: 13px;
                            text-transform: uppercase;
                            letter-spacing: 1px;
                            font-weight: bold;
                            color: #777777;
                        "
                    >
                        Estado de la solicitud
                    </p>

                    <p
                        style="
                            margin: 0;
                            font-family: Georgia, 'Times New Roman', serif;
                            font-size: 23px;
                            font-weight: bold;
                            color: #c1272d;
                        "
                    >
                        {{estado}}
                    </p>
                </div>

                <!-- MENSAJE PERSONALIZADO -->
                <p
                    style="
                        margin: 0 0 25px 0;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 16px;
                        line-height: 1.7;
                        color: #4a3a34;
                    "
                >
                    {{mensaje}}
                </p>

                <!-- BOTÓN -->
                <p
                    style="
                        margin: 25px 0 0 0;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 15px;
                        line-height: 1.6;
                        color: #777777;
                    "
                >
                    {{mensajeFinal}}
                </p>

                <p
                    style="
                        margin: 0;
                        font-family: Arial, Helvetica, sans-serif;
                        font-size: 14px;
                        line-height: 1.6;
                        text-align: justify;
                        color: #777777;
                    "
                >
                    Si tenés alguna consulta, podés acercarte al mostrador y comunicarte con nuestro supervisor.
                </p>
            </div>

            <!-- PIE -->
            <div style="padding: 22px 30px; background-color: #3a2923; text-align: center">
                <p
                    style="
                        margin: 0 0 6px 0;
                        font-family: Georgia, 'Times New Roman', serif;
                        font-size: 18px;
                        color: #f7efe3;
                        font-weight: bold;
                    "
                >
                    Cyberia
                </p>

                <p style="margin: 0; font-family: Arial, Helvetica, sans-serif; font-size: 12px; color: #d8c9bd">
                    Este es un correo automático. Por favor, no respondas a este mensaje.
                </p>
            </div>
        </div>
    </div>
</div>
