<html>
    <body>
        <div
            style="
                margin: 0;
                padding: 0;
                width: 100%;
                background-color: #f7efe3;
                font-family: Arial, Helvetica, sans-serif;
                color: #3a2923;
            "
        >
            <div style="max-width: 600px; margin: 0 auto; padding: 40px 20px">
                <!-- CONTENEDOR PRINCIPAL -->
                <div
                    style="
                        background-color: #fff;
                        border-radius: 14px;
                        overflow: hidden;
                        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
                    "
                >
                    <!-- ENCABEZADO -->
                    <div style="background-color: #e8612d; padding: 10px 15px; display: flex; justify-content: center">
                        <img
                            src="https://uwmptccyleznngdazgrp.supabase.co/storage/v1/object/public/Fotos/assets/logo-3d-blanco.png"
                            alt="Logo de Cyberia"
                            style="max-width: 180px; height: 100%; max-height: 120px; display: block; margin: 0 auto"
                        />
                    </div>
                    <!-- CONTENIDO -->
                    <div style="padding: 35px 30px 30px 30px">
                        <!-- TÍTULO DINÁMICO -->
                        <p
                            style="
                                margin: 0 0 10px 0;
                                font-family: Georgia, serif;
                                font-size: 28px;
                                font-weight: bold;
                                color: {{params.colorEstado}};
                            "
                        >
                            {{ params.titulo }}
                        </p>
                        <!-- SALUDO -->
                        <p style="margin: 0 0 25px 0; font-family: Arial, sans-serif; font-size: 17px; color: #3a2923">
                            Hola <strong>{{ params.nombre }}</strong>,
                        </p>
                        <!-- ESTADO DINÁMICO -->
                        <!-- Cambia el color del borde izquierdo según el estado recibido -->
                        <div
                            style="margin: 0 0 25px 0; padding: 18px; background-color: #f7efe3; border-radius: 6px; border-left: 5px solid {{params.colorEstado}};"
                        >
                            <p
                                style="
                                    margin: 0 0 8px 0;
                                    font-family: Arial, sans-serif;
                                    font-size: 13px;
                                    text-transform: uppercase;
                                    font-weight: bold;
                                    color: #777777;
                                "
                            >
                                Estado de la solicitud
                            </p>
                            <p
                                style="margin: 0; font-family: Georgia, serif; font-size: 23px; font-weight: bold; color: {{params.colorEstado}};"
                            >
                                {{ params.estado }}
                            </p>
                        </div>
                        <!-- MENSAJE PRINCIPAL -->
                        <p
                            style="
                                margin: 0 0 25px 0;
                                font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                                font-size: 16px;
                                line-height: 1.7;
                                color: #4a3a34;
                            "
                        >
                            {{ params.mensaje }}
                        </p>
                        <!-- INFORMACIÓN FINAL -->
                        <p
                            style="
                                margin: 0;
                                font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                                font-size: 14px;
                                line-height: 1.6;
                                color: #777777;
                            "
                        >
                            {{ params.mensajeFinal }}
                        </p>
                    </div>
                    <!-- PIE -->
                    <div style="padding: 22px 30px; background-color: #3a2923; text-align: center">
                        <p
                            style="
                                margin: 0 0 6px 0;
                                font-family: Georgia, 'Times New Roman', serif;
                                font-size: 18px;
                                color: #f7efe3;
                                font-weight: bold;
                            "
                        >
                            Cyberia
                        </p>
                        <p
                            style="
                                margin: 0;
                                font-family: Arial, Helvetica, sans-serif;
                                font-size: 12px;
                                color: #d8c9bd;
                            "
                        >
                            Este es un correo automático. Por favor, no respondas a este mensaje.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </body>
</html>
