<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header
            class="inferior sin-labio"
            [defaultHref]="'/inicio'"
            [tituloHeader]="'Pedir la cuenta'"
        ></app-header>

        <div class="superior hoja">
            @if(propinaAgregada()){ @if(pedido()){
            <app-tarjeta-factura [pedido]="pedido()"></app-tarjeta-factura>} @else {
            <p>No se pudo actualizar su pedido.</p>
            } } @else {
            <app-boton-home [boton]="boton"></app-boton-home>
            }
        </div>
    </div>
</ion-content>
