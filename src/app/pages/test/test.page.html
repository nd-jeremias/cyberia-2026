<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-title>Pantalla de pruebas</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <div class="pantalla-preparacion">
        <img class="logo-preparacion" src="assets/logo.png" alt="Cyberia Restó" />

        <div class="tarjeta-preparacion">
            <span class="sello-preparacion">
                <ion-icon name="information-circle-outline"></ion-icon>
                Uso interno
            </span>

            <h2>Pantalla de pruebas</h2>
            <p>
                Espacio reservado para probar componentes durante el desarrollo. No forma parte del circuito
                de la aplicación.
            </p>
        </div>
    </div>
</ion-content>
