<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header class="inferior sin-labio" [defaultHref]="volverA()" [tituloHeader]="titulo()"></app-header>

        <div class="superior hoja">
            @if (cargando()) {
            <div class="estado-vacio">
                <fa-icon [icon]="['fas', 'clock']"></fa-icon>
                <p>Abriendo la conversación…</p>
            </div>
            } @else if (sinMesa()) {
            <div class="estado-vacio">
                <fa-icon [icon]="['fas', 'lock']"></fa-icon>
                <p>Para consultar al mozo primero necesitás una mesa asignada.</p>
            </div>
            } @else {
            <app-sala-conversacion
                [mensajes]="mensajes()"
                [usuarioId]="usuarioId()"
                [clienteId]="chatActual()?.clienteId ?? usuarioId()"
                [numeroMesa]="numeroMesa()"
                [enviando]="enviando()"
                [sugerencias]="esMozo() ? [] : sugerencias"
                [textoVacio]="textoVacio()"
                (enviar)="enviar($event)"
            ></app-sala-conversacion>
            }
        </div>
    </div>
</ion-content>
