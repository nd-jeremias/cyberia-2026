<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/gestion-productos" text="Volver"></ion-back-button>
        </ion-buttons>
        <ion-title>{{ titulo() }}</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <app-formulario-alta-producto
        [tipo]="tipo()"
        [productoExistente]="productoExistente()"
        (productoSubmit)="onAltaProducto($event)"
    ></app-formulario-alta-producto>
</ion-content>
