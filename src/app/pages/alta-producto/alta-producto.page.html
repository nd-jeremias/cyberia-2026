<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header class="inferior sin-labio" [defaultHref]="'/gestion-productos'" [tituloHeader]="titulo()"></app-header>

        <div class="superior hoja">
            <app-formulario-alta-producto
                [tipo]="tipo()"
                [productoExistente]="productoExistente()"
                (productoSubmit)="onAltaProducto($event)"
            ></app-formulario-alta-producto>
        </div>
    </div>
</ion-content>
