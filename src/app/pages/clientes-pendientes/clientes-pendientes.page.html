<ion-header [translucent]="true">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button defaultHref="/inicio" text=""></ion-back-button>
        </ion-buttons>
        <ion-title>Clientes pendientes</ion-title>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <app-listado-clientes-pendientes
        [clientes]="clientes()"
        (aprobarCliente)="onAprobar($event)"
        (rechazarCliente)="onRechazar($event)"
    ></app-listado-clientes-pendientes>
</ion-content>
