<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header class="inferior sin-labio" [defaultHref]="'/juegos'" [tituloHeader]="'Adivina el par'">
            @if(game.gameState() === 'PLAYING'){
            <span accion class="btn-banda"> {{ memoria.timerService.segundos() }}s </span>
            }
        </app-header>
        <div class="superior hoja">
            @switch (game.gameState()) { 
                @case ('RULES'){
                    <app-tarjeta-informacion-cliente [texto]="textoInformativo()"></app-tarjeta-informacion-cliente>
                    <button class="btn-primario" (click)="game.gameState.set('PLAYING')">
                        Continuar<fa-icon [icon]="['fas', 'chevron-right']"></fa-icon>
                    </button>
                } 
                @case ('PLAYING') {
                    <app-memoria-board></app-memoria-board>
                    <button class="btn-primario" (click)="cancelarIntento()">SALIR</button>
                }
                <!-- @case ('RESULT'){ }  -->
            }
        </div>
    </div>
</ion-content>
