<app-header [defaultHref]="'/inicio'" [tituloHeader]="'Ingreso al local'"></app-header>

<ion-content [fullscreen]="true">
    <div class="hoja pantalla-ingreso">
        <div class="tarjeta-estado">
            <span class="medallon">
                <ion-icon [name]="puedeAnotarse() ? 'qr-code-outline' : 'time-outline'"></ion-icon>
            </span>

            @if (cargando()) {
            <p class="leyenda">Consultando tu estado…</p>
            } @else {
            <p class="leyenda">{{ leyenda() }}</p>
            }
        </div>

        @if (puedeAnotarse() && !cargando()) {
        <button type="button" class="btn-principal" (click)="escanear()">
            <ion-icon name="scan-outline"></ion-icon>
            Escanear código de ingreso
        </button>

        <p class="ayuda">
            El código está en la puerta del local. Al escanearlo quedás anotado en la lista de espera
            y el metre te asigna una mesa.
        </p>
        }
    </div>
</ion-content>
