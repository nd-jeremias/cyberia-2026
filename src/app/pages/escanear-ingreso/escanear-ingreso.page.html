<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header
            class="inferior sin-labio"
            [defaultHref]="'/inicio'"
            [tituloHeader]="'Ingreso al local'"
        ></app-header>

        <div class="superior hoja pantalla-ingreso">
            <div class="tarjeta-estado">
                <span class="medallon">
                    @let icono = puedeAnotarse() ? 'user-slash' : 'clock';
                    <fa-icon [icon]="['fas', icono]"></fa-icon>
                </span>

                @if (cargando()) {
                <p class="leyenda">Consultando tu estado…</p>
                } @else {
                <p class="leyenda">{{ leyenda() }}</p>
                }
            </div>

            @if (puedeAnotarse() && !cargando()) {

            <div class="tarjeta-estado ayuda">
                <span class="medallon"><fa-icon [icon]="['fas', 'circle-question']"></fa-icon></span>
                <p>
                    El código está en la puerta del local. Al escanearlo quedás anotado en la lista de espera y el metre
                    te asigna una mesa.
                </p>
            </div>

            <button type="button" class="btn-principal" (click)="escanear()">
                <fa-icon [icon]="['fas', 'qrcode']"></fa-icon>
                Escanear código de ingreso
            </button>
            }
        </div>
    </div>
</ion-content>
