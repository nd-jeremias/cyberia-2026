<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header
            class="inferior sin-labio"
            [defaultHref]="'/inicio'"
            /* [tituloHeader]="corrigiendo() ? 'Corregir pedido' : 'Carta'" */
        ></app-header>

        <div class="superior hoja pantalla-carta">
            <!--
              Acá no va ningún cartel informativo: el alto que ocupan es el que
              necesita la foto del producto. Lo que había que decir ya está
              dicho en otro lado: que el mozo pidió cambios lo dice el título
              de la pantalla ("Corregir pedido"), y que ya hay un pedido
              enviado se lo explica `agregar()` al tocar "Agregar al pedido".
            -->

            <!-- Comidas, bebidas y postres: el filtro es de pantalla, la carta ya está cargada. -->
            <nav class="solapas" aria-label="Secciones de la carta">
                @for (solapa of solapas; track solapa.tipo) {
                <button
                    type="button"
                    class="solapa"
                    [class.solapa-activa]="solapaActiva() === solapa.tipo"
                    [attr.aria-pressed]="solapaActiva() === solapa.tipo"
                    (click)="cambiarSolapa(solapa.tipo)"
                >
                    <fa-icon [icon]="['fas', solapa.icono]"></fa-icon>
                    <span class="solapa-etiqueta">{{ solapa.etiqueta }}</span>
                    <span class="solapa-cuenta">{{ cuentaDe(solapa.tipo) }}</span>
                </button>
                }
            </nav>

            @if (cargando()) {
            <div class="estado-vacio">
                <fa-icon [icon]="['fas', 'utensils']"></fa-icon>
                <p>Cargando la carta…</p>
            </div>
            } @else {
            <!-- `reel`: una tarjeta por pantalla, sin desplazamiento libre. El
                 título del listado no va: las solapas de arriba ya dicen qué
                 sección se está mirando. -->
            <app-tarjeta-listado-producto
                class="reel"
                [productos]="productosVisibles()"
                [cantidades]="cantidades()"
                modo="pedido"
                (agregarCarrito)="agregar($event)"
                (quitarCarrito)="quitar($event)"
            ></app-tarjeta-listado-producto>
            }
        </div>

        <!--
  Pie fijo con el importe acumulado. El enunciado pide que el total esté
  visible en todo momento y con buen tamaño, así que vive fuera del scroll.
-->
        <footer class="inferior-final pie-pedido  fondo-texturizado">
            <div class="pie-importe">
                <span class="pie-rotulo">
                    @if (hayPedido()) { {{ unidades() }} {{ unidades() === 1 ? 'producto' : 'productos' }} · {{
                    carrito.tiempoEstimado() }} min } @else { Tu pedido está vacío }
                </span>
                <span class="pie-total">{{ totalFormateado() }}</span>
            </div>

            <div class="pie-acciones">
                <!-- El pedido se manda desde "Mi pedido", después de repasarlo. -->
                <button type="button" class="btn-banda pie-boton" [disabled]="!hayPedido()" (click)="irAlResumen()">
                    <fa-icon [icon]="['fas', 'receipt']"></fa-icon>
                    {{ corrigiendo() ? 'Revisar cambios' : 'Ver mi pedido' }}
                </button>
            </div>
        </footer>
    </div>
</ion-content>
