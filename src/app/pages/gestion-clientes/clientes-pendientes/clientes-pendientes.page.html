<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header class="inferior sin-labio" [defaultHref]="'/inicio'" [tituloHeader]="'Clientes pendientes'"></app-header>

        <div class="superior hoja">
            <app-listado-clientes-pendientes

        </div>
    </div>
</ion-content>
