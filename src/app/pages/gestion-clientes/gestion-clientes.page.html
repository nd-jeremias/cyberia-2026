<app-header [defaultHref]="'/inicio'" [tituloHeader]="'Gestión de clientes'"></app-header>

<ion-content [fullscreen]="true">
    <div class="pantalla-preparacion">
        <img class="logo-preparacion" src="assets/logo.png" alt="Cyberia Restó" />

        <div class="tarjeta-preparacion">
            <span class="sello-preparacion">
                <ion-icon name="time-outline"></ion-icon>
                En preparación
            </span>

            <h2>Aprobación de clientes</h2>
            <p>Desde acá el dueño y el supervisor van a poder revisar las solicitudes de registro, ver la foto de cada persona y aprobarlas o rechazarlas. Cada decisión dispara automáticamente el correo electrónico correspondiente.</p>

            <span class="referencia-enunciado">
                <ion-icon name="information-circle-outline"></ion-icon>
                Puntos 6, 7 y 8 del enunciado
            </span>
        </div>
    </div>
</ion-content>
