<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header class="inferior sin-labio" [defaultHref]="'/gestion-empleados'" [tituloHeader]="titulo()"></app-header>

        <div class="superior hoja hoja-angosta">
            <app-formulario-registro
                [modo]="'modificar_empleado'"
                [usuarioExistente]="empleadoExistente()"
                [usuarioRol]="'dueño'"
                (registroSubmit)="handleRegistro($event)"
                [direccionCamara]="'frontal'"
            ></app-formulario-registro>
        </div>
    </div>
</ion-content>
