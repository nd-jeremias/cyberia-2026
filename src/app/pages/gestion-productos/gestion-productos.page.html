<ion-content [fullscreen]="true">
    <div class="layout-superpuesto fondo-texturizado">
        <app-header class="inferior sin-labio" [defaultHref]="'/inicio'" [tituloHeader]="titulo()">
            <button accion type="button" class="btn-banda" (click)="irACrear()">
                <fa-icon [icon]="['fas', 'circle-plus']"></fa-icon>
                {{ textoBotonCrear() }}
            </button>
        </app-header>

        <div class="superior hoja">
            <app-tarjeta-listado-producto
                [productos]="productos()"
                [tituloListado]="tituloListado()"
                modo="gestion"
                (editarProducto)="onEditar($event)"
                (eliminarProducto)="onEliminar($event)"
            ></app-tarjeta-listado-producto>
        </div>
    </div>
</ion-content>
