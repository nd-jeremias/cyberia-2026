<app-header [defaultHref]="'/inicio'" [tituloHeader]="titulo()">
    <button accion type="button" class="btn-banda" (click)="irACrear()">
        <ion-icon name="add-circle-outline"></ion-icon>
        {{ textoBotonCrear() }}
    </button>
</app-header>

<ion-content [fullscreen]="true">
    <app-tarjeta-listado-producto
        [productos]="productos()"
        [tituloListado]="tituloListado()"
        modo="gestion"
        (editarProducto)="onEditar($event)"
        (eliminarProducto)="onEliminar($event)"
    ></app-tarjeta-listado-producto>
</ion-content>
