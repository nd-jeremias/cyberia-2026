<section class="listado-clientes">
    <h2 class="titulo-listado titulo-seccion">{{ tituloListado() }}</h2>

    @if (clientes().length === 0) {
        <div class="estado-vacio">
            <ion-icon name="checkmark-circle"></ion-icon>
            <p>No hay clientes esperando aprobación en este momento.</p>
        </div>
    } @else {
        <div class="lista">
            @for (cliente of clientes(); track cliente.id) {
                <app-tarjeta-usuario
                    [usuario]="cliente"
                    [acciones]="acciones"
                    (accionSeleccionada)="onAccion($event)"
                ></app-tarjeta-usuario>
            }
        </div>
    }
</section>
