<section class="listado-clientes">
    <h2 class="titulo-listado">{{ tituloListado() }}</h2>

    @if (clientes().length === 0) {
        <p class="listado-vacio">
            No hay clientes esperando aprobación en este momento.
        </p>
    } @else {
        <div class="lista">
            @for (cliente of clientes(); track cliente.id) {
                <app-tarjeta-usuario
                    [usuario]="cliente"
                    [acciones]="acciones"
                    (accionSeleccionada)="onAccion($event)"
                ></app-tarjeta-usuario>
            }
        </div>
    }
</section>
