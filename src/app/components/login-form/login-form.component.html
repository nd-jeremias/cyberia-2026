<div class="pantalla-login">
  
  <!-- 1. Cabecera con Isotipo -->
  <header class="cabecera">
    <div class="isotipo-icono">
      <ion-icon name="restaurant-outline"></ion-icon>
    </div>
    <h1>Sistema de gestión gastronómica</h1>
    <p>Ingresá con tu cuenta</p>
  </header>

  <!-- 2. Formulario Principal -->
  <section class="seccion-form">
    <form [formGroup]="formulario" (ngSubmit)="onLogin()">
      
      <!-- Campo Email -->
      <div class="grupo-input">
        <label class="input-label">Correo electrónico</label>
        <div class="caja-input">
          <ion-icon name="mail-outline" class="icono-campo"></ion-icon>
          <ion-input
            formControlName="email"
            type="email"
            placeholder="nombre@restaurante.com">
          </ion-input>
        </div>
      </div>

      <!-- Campo Contraseña -->
      <div class="grupo-input">
        <label class="input-label">Contraseña</label>
        <div class="caja-input">
          <ion-icon name="lock-closed-outline" class="icono-campo"></ion-icon>
          <ion-input
            formControlName="password"
            type="password"
            placeholder="••••••••">
            <ion-input-password-toggle slot="end" color="medium"></ion-input-password-toggle>
          </ion-input>
        </div>
      </div>

      <!-- Botón Principal -->
      <button type="submit" class="btn-principal">
        Iniciar sesión
      </button>

      <!-- Enlaces secundarios -->
      <div class="enlaces-secundarios">
        <p>¿No tenés cuenta? <a routerLink="/registrarse">Registrate</a></p>
        <button type="button" class="btn-link-anonimo" (click)="ingresoAnonimo()">
          O continuar como <strong>Invitado / Anónimo</strong>
        </button>
      </div>

    </form>
  </section>

  <!-- 3. Accesos Rápidos Demo -->
  <footer class="seccion-demo">
    <div class="divisor-demo">
      <span>Acceso rápido · demo</span>
    </div>

    <div class="grilla-perfiles">
      @for (perfil of usuariosValidos; track perfil.email) {
        <button 
          type="button" 
          class="card-perfil" 
          (click)="cargarCredenciales(perfil.email, perfil.pass)">
          <div class="icono-perfil-wrapper">
            <ion-icon [name]="perfil.icono"></ion-icon>
          </div>
          <div class="textos-perfil">
            <span class="rol">{{ perfil.rol }}</span>
            <span class="email">{{ perfil.email }}</span>
          </div>
        </button>
      }
    </div>

    <small class="pie-ayuda">Tocá un perfil para autocompletar las credenciales</small>
  </footer>

</div>
