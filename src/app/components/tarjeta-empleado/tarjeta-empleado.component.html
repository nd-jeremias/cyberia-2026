<article class="tarjeta-usuario">
    <div class="contenedor-foto">
        @if (usuario().foto_url) {
        <img class="foto-usuario" [src]="usuario().foto_url" [alt]="'Foto de ' + nombreCompleto()" />
        } @else {
        <div class="foto-ausente">
            <fa-icon [icon]="['fas', 'user-xmark']"></fa-icon>
        </div>
        }
    </div>

    <div class="datos-usuario">
        <h3 class="nombre-usuario">{{ nombreCompleto() }}</h3>
        <p class="dato">CUIL: {{ usuario().cuil }}</p>
        <p class="dato">{{ usuario().correo_electronico }}</p>
        <ion-badge>{{ usuario().perfil }}</ion-badge>
    </div>

    <div class="acciones-gestion">
        <ion-button expand="block" fill="outline" class="boton-editar" (click)="onEditar()"
            ><fa-icon [icon]="['fas', 'pen-to-square']"></fa-icon> Editar
        </ion-button>
        <ion-button
            [disabled]="usuario().perfil == 'dueño'"
            expand="block"
            color="danger"
            class="boton-eliminar"
            (click)="onEliminar()"
        >
            <fa-icon [icon]="['fas', 'user-xmark']"></fa-icon>
            Eliminar
        </ion-button>
    </div>
</article>
