<ion-modal [isOpen]="modalService.isModalOpen()" class="modal-personalizado">
    <ng-template class="box">
        <ion-header>
            <ion-toolbar>
                <ion-title>{{ modalService.tituloModal() }}</ion-title>
            </ion-toolbar>
        </ion-header>
        <!-- Un div y no <ion-content>: ion-content es un contenedor de scroll
             que no informa alto propio, así que con `--height: auto` el modal
             colapsaba y recortaba el mensaje. -->
        <div class="contenido">
            <p>{{ modalService.mensajeModal() }}</p>
        </div>
        <ion-footer>
            <ion-buttons class="botonContainer">
                <ion-button class="botonCerrar" (click)="modalService.setClose()">Cerrar</ion-button>
            </ion-buttons>
        </ion-footer>
    </ng-template>
</ion-modal>
