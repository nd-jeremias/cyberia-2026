<article class="tarjeta-mesa">
    <div class="container">
        @if (!mesa().fotoUrl) {
        <div class="container-placeholder">
            <ion-icon name="image-outline"></ion-icon>
            <span>Sin imagen disponible</span>
        </div>
        } @else {
        <div class="container-pista">
            <div class="container-slide">
                @if (!mesa().fotoUrl) {
                <div class="container-placeholder">
                    <ion-icon name="image-outline"></ion-icon>
                    <span>Sin imagen disponible</span>
                </div>
                } @else {
                <img class="foto-principal" [src]="mesa().fotoUrl" [alt]="mesa().numeroMesa" />
                }
            </div>
        </div>
        }
    </div>

    <div class="contenido">
        <div class="header">
            <h3 class="numero">NÚMERO: {{ mesa().numeroMesa }}</h3>
            <span
                [class.color-disponible]="mesa().disponibilidad === 'Disponible'"
                [class.color-reservada]="mesa().disponibilidad === 'Reservada'"
                [class.color-pcupada]="mesa().disponibilidad === 'Ocupada'"
                class="disponibilidad"
                >{{ mesa().disponibilidad }}</span
            >
        </div>
        <div class="detalles">
            <span class="detalle">
                <ion-icon name="time-outline"></ion-icon>
                {{ mesa().tipo }}
            </span>
            <span class="lugares">Lugares: {{ mesa().cantidadLugares }}</span>
        </div>

        <!-- El QR va primero y a lo ancho: es lo que hay que imprimir y pegar
             en la mesa, así que es la acción que más se busca acá. -->
        <ion-button expand="block" fill="outline" class="boton-qr" (click)="onVerQr()">
            <ion-icon name="qr-code-outline" slot="start"></ion-icon>
            Ver código QR
        </ion-button>

        <div class="acciones-gestion">
            <ion-button expand="block" fill="outline" class="boton-editar" (click)="onEditar()">
                <ion-icon name="create-outline" slot="start"></ion-icon>
                Editar
            </ion-button>
            <ion-button expand="block" color="danger" class="boton-eliminar" (click)="onEliminar()">
                <ion-icon name="trash-outline" slot="start"></ion-icon>
                Eliminar
            </ion-button>
        </div>
    </div>
</article>
