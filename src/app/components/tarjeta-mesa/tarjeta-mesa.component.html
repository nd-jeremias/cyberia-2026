<article class="tarjeta-mesa">
    <div class="container">
        @if (!mesa().fotoUrl) {
        <div class="container-placeholder">
            <fa-icon [icon]="['fas', 'image']"></fa-icon>
            <span>Sin imagen disponible</span>
        </div>
        } @else {
        <div class="container-pista">
            <div class="container-slide">
                @if (!mesa().fotoUrl) {
                <div class="container-placeholder">
                    <fa-icon [icon]="['fas', 'image']"></fa-icon>
                    <span>Sin imagen disponible</span>
                </div>
                } @else {
                <img class="foto-principal" [src]="mesa().fotoUrl" [alt]="mesa().numeroMesa" />
                }
            </div>
        </div>
        }
    </div>

    <div class="contenido">
        <div class="header">
            <h3 class="numero">NÚMERO: {{ mesa().numeroMesa }}</h3>
            <span
                [class.color-disponible]="mesa().disponibilidad === 'Disponible'"
                [class.color-reservada]="mesa().disponibilidad === 'Reservada'"
                [class.color-pcupada]="mesa().disponibilidad === 'Ocupada'"
                class="disponibilidad"
                >{{ mesa().disponibilidad }}</span
            >
        </div>
        <div class="detalles">
            <span class="detalle">
                <fa-icon [icon]="['fas', icono()]"></fa-icon>
                {{ mesa().tipo }}
            </span>
            <span class="lugares"><fa-icon [icon]="['fas', 'chair']"></fa-icon>: {{ mesa().cantidadLugares }}</span>
        </div>

        <!-- El QR va primero y a lo ancho: es lo que hay que imprimir y pegar
             en la mesa, así que es la acción que más se busca acá. -->
        <button class="btn boton-qr" (click)="onVerQr()">
            <fa-icon [icon]="['fas', 'qrcode']"></fa-icon>
            Ver código QR
        </button>

        <div class="acciones-gestion">
            <button type="button" class="btn btn-edit" (click)="onEditar()">
                <fa-icon [icon]="['fas', 'pen-to-square']"></fa-icon>
                Modificar
            </button>
            <button type="button" class="btn btn-delete" (click)="onEliminar()">
                <fa-icon [icon]="['fas', 'trash-can']"></fa-icon>
                Eliminar
            </button>
        </div>
    </div>
</article>
