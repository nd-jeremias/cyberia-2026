<ion-card>
    <ion-card-header>
        <ion-card-title>{{ tituloFormulario() }}</ion-card-title>
    </ion-card-header>

    <ion-card-content>
        <form [formGroup]="formulario" (ngSubmit)="onAltaProducto()">
            <ion-item>
                <ion-input
                    formControlName="nombre"
                    type="text"
                    label="Nombre"
                    labelPlacement="floating"
                    placeholder="Milanesa con Papas Fritas"
                ></ion-input>
            </ion-item>

            <ion-item>
                <ion-textarea
                    formControlName="descripcion"
                    label="Descripción"
                    labelPlacement="floating"
                    placeholder="Milanesa de nalga rebozada acompañada de papas fritas."
                    [autoGrow]="true"
                ></ion-textarea>
            </ion-item>

            <ion-item>
                <ion-input
                    formControlName="tiempoElaboracionMinutos"
                    type="number"
                    inputmode="numeric"
                    min="1"
                    label="Tiempo de elaboración (minutos)"
                    labelPlacement="floating"
                    placeholder="20"
                ></ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                    formControlName="precio"
                    type="number"
                    inputmode="decimal"
                    min="0.01"
                    step="0.01"
                    label="Precio"
                    labelPlacement="floating"
                    placeholder="4500.00"
                ></ion-input>
            </ion-item>

            <ion-item lines="none" class="item-fotos">
                <div class="fotos-contenedor">
                    <p class="fotos-etiqueta">
                        @if (modoEdicion()) {
                            Fotos del producto (tocá el − para quitar una y el + para reemplazarla; siempre tienen que ser 3)
                        } @else {
                            Fotos del producto (3 requeridas)
                        }
                    </p>
                    <app-subida-imagenes
                        [maxImages]="3"
                        [modoCamara]="'galeria'"
                        [imagenesIniciales]="fotosIniciales()"
                        (imagenesChange)="onFotosSeleccionadas($event)"
                        (urlsExistentesChange)="onUrlsExistentes($event)"
                    ></app-subida-imagenes>
                </div>
            </ion-item>

            <div class="acciones">
                <ion-button expand="block" type="submit">{{ textoBoton() }}</ion-button>
            </div>
        </form>
    </ion-card-content>
</ion-card>
