<div class="pantalla-alta-producto">
    <header class="cabecera-producto">
        <h2>{{ tituloFormulario() }}</h2>
        <p>Completá los datos y sumá las tres fotos del producto</p>
    </header>

    <div class="seccion-form panel">
        <form [formGroup]="formulario" (ngSubmit)="onAltaProducto()">
            <div class="grupo-input">
                <label class="input-label">Nombre</label>
                <div class="caja-input">
                    <ion-icon name="restaurant-outline" class="icono-campo"></ion-icon>
                    <ion-input
                        formControlName="nombre"
                        type="text"
                        placeholder="Milanesa con papas fritas"
                    ></ion-input>
                </div>
            </div>

            <div class="grupo-input">
                <label class="input-label">Descripción</label>
                <div class="caja-input caja-input-alta">
                    <ion-icon name="list-outline" class="icono-campo"></ion-icon>
                    <ion-textarea
                        formControlName="descripcion"
                        placeholder="Milanesa de nalga rebozada acompañada de papas fritas."
                        [autoGrow]="true"
                        [rows]="2"
                    ></ion-textarea>
                </div>
            </div>

            <!-- Tiempo y precio comparten fila: son dos datos cortos y juntos
                 evitan dos renglones casi vacíos. -->
            <div class="fila-doble">
                <div class="grupo-input">
                    <label class="input-label">Tiempo (minutos)</label>
                    <div class="caja-input">
                        <ion-icon name="time-outline" class="icono-campo"></ion-icon>
                        <ion-input
                            formControlName="tiempoElaboracionMinutos"
                            type="number"
                            inputmode="numeric"
                            min="1"
                            placeholder="20"
                        ></ion-input>
                    </div>
                </div>

                <div class="grupo-input">
                    <label class="input-label">Precio</label>
                    <div class="caja-input">
                        <ion-icon name="pricetag-outline" class="icono-campo"></ion-icon>
                        <ion-input
                            formControlName="precio"
                            type="number"
                            inputmode="decimal"
                            min="0.01"
                            step="0.01"
                            placeholder="4500.00"
                        ></ion-input>
                    </div>
                </div>
            </div>

            <div class="bloque-fotos">
                <p class="fotos-etiqueta">
                    @if (modoEdicion()) {
                        Fotos del producto: tocá el signo menos para quitar una y el más para reemplazarla. Siempre tienen que ser tres.
                    } @else {
                        Fotos del producto: se necesitan tres.
                    }
                </p>
                <app-subida-imagenes
                    [maxImages]="3"
                    [modoCamara]="'camara'"
                    [direccionCamara]="'trasera'"
                    [permitirGaleria]="true"
                    [imagenesIniciales]="fotosIniciales()"
                    (imagenesChange)="onFotosSeleccionadas($event)"
                    (urlsExistentesChange)="onUrlsExistentes($event)"
                ></app-subida-imagenes>
            </div>

            <div class="acciones">
                <ion-button expand="block" type="submit" class="btn-principal">{{ textoBoton() }}</ion-button>
            </div>
        </form>
    </div>
</div>
