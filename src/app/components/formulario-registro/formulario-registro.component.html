<ion-card>
    <ion-card-header>
        <ion-card-title>Registrarse</ion-card-title>
    </ion-card-header>

    <ion-card-content>
        <form [formGroup]="formulario" (ngSubmit)="onRegistro()">
            <ion-item>
                <ion-input
                    formControlName="nombres"
                    type="text"
                    label="Nombres"
                    labelPlacement="floating"
                    placeholder="Juan"
                ></ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                    formControlName="apellidos"
                    type="text"
                    label="Apellidos"
                    labelPlacement="floating"
                    placeholder="Gómez"
                ></ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                    formControlName="dni"
                    type="text"
                    inputmode="numeric"
                    label="DNI"
                    labelPlacement="floating"
                    placeholder="12345678"
                ></ion-input>
            </ion-item>

            @if (esDueno()) {
                <ion-item>
                    <ion-input
                        formControlName="cuil"
                        type="text"
                        inputmode="numeric"
                        label="CUIL"
                        labelPlacement="floating"
                        placeholder="20123456783"
                    ></ion-input>
                </ion-item>
            }

            <ion-item>
                <ion-input
                    formControlName="correo"
                    type="email"
                    label="Correo electrónico"
                    labelPlacement="floating"
                    placeholder="juangomez@gmail.com"
                ></ion-input>
            </ion-item>

            @if (esDueno()) {
                <ion-item>
                    <ion-select
                        formControlName="tipoEmpleado"
                        label="Tipo de empleado"
                        labelPlacement="floating"
                        placeholder="Seleccionar"
                    >
                        @for (tipo of tiposEmpleado; track tipo) {
                            <ion-select-option [value]="tipo">{{
                                tipo
                            }}</ion-select-option>
                        }
                    </ion-select>
                </ion-item>
            }

            <ion-item>
                <label class="input-archivo">
                    Foto de perfil
                    <input
                        type="file"
                        accept="image/*"
                        (change)="onFotoSeleccionada($event)"
                    />
                </label>
            </ion-item>

            <ion-item>
                <ion-input
                    formControlName="password"
                    label="Contraseña"
                    labelPlacement="floating"
                    type="password"
                >
                    <ion-input-password-toggle
                        show-icon="eye-off"
                        hide-icon="eye"
                        color="light"
                        slot="end"
                    ></ion-input-password-toggle>
                </ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                    formControlName="confirmPassword"
                    label="Confirmar contraseña"
                    labelPlacement="floating"
                    type="password"
                >
                    <ion-input-password-toggle
                        show-icon="eye-off"
                        hide-icon="eye"
                        color="light"
                        slot="end"
                    ></ion-input-password-toggle>
                </ion-input>
            </ion-item>

            <ion-button expand="full" fill="outline" type="submit"
                >Registrarse</ion-button
            >
        </form>
    </ion-card-content>
</ion-card>
