<ion-card class="pantalla-registro">
    <ion-card-header class="cabecera-registro">
        <ion-card-title>Registrarse</ion-card-title>
    </ion-card-header>

    <ion-card-content>
        <form [formGroup]="formulario" (ngSubmit)="onRegistro()" class="formulario-cuerpo">
            <ion-item class="item-input">
                <ion-input
                    formControlName="nombres"
                    errorText="Ingrese los nombres"
                    [class.ion-invalid]="hayError('nombres', 'required')"
                    [class.ion-touched]="hayError('nombres', 'required')"
                    type="text"
                    label="Nombres"
                    labelPlacement="floating"
                    placeholder="Juan"
                ></ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                    formControlName="apellidos"
                    errorText="Ingrese los apellidos"
                    [class.ion-invalid]="hayError('apellidos', 'required')"
                    [class.ion-touched]="hayError('apellidos', 'required')"
                    type="text"
                    label="Apellidos"
                    labelPlacement="floating"
                    placeholder="Gómez"
                ></ion-input>
            </ion-item>

            <ion-item class="item-input">
                <ion-input
                    formControlName="dni"
                    errorText="El DNI debe tener 7 u 8 dígitos"
                    [class.ion-invalid]="hayError('dni', 'required') || hayError('dni', 'pattern')"
                    [class.ion-touched]="hayError('dni', 'required') || hayError('dni', 'pattern')"
                    type="text"
                    inputmode="numeric"
                    label="DNI"
                    labelPlacement="floating"
                    placeholder="12345678"
                ></ion-input>
            </ion-item>
            <ion-button type="button" class="boton-scanner" (click)="scanearDNI()">
                <span>Escanear</span>
            </ion-button>

            @if (esDueno()) {
                <ion-item class="item-input">
                    <ion-input
                        formControlName="cuil"
                        errorText="El CUIL debe tener 11 dígitos"
                        [class.ion-invalid]="hayError('cuil', 'required') || hayError('cuil', 'pattern')"
                        [class.ion-touched]="hayError('cuil', 'required') || hayError('cuil', 'pattern')"
                        type="text"
                        inputmode="numeric"
                        label="CUIL"
                        labelPlacement="floating"
                        placeholder="20123456783"
                    ></ion-input>
                </ion-item>
            }

            <ion-item class="item-input">
                <ion-input
                    formControlName="correo"
                    errorText="Ingrese un correo electrónico válido"
                    [class.ion-invalid]="hayError('correo', 'required') || hayError('correo', 'email')"
                    [class.ion-touched]="hayError('correo', 'required') || hayError('correo', 'email')"
                    type="email"
                    label="Correo electrónico"
                    labelPlacement="floating"
                    placeholder="juangomez@gmail.com"
                ></ion-input>
            </ion-item>

            @if (esDueno()) {
                <ion-item class="item-input">
                    <ion-select
                        formControlName="tipoEmpleado"
                        label="Tipo de empleado"
                        labelPlacement="floating"
                        placeholder="Seleccionar"
                    >
                        @for (tipo of tiposEmpleado; track tipo) {
                            <ion-select-option [value]="tipo">{{
                                tipo
                            }}</ion-select-option>
                        }
                    </ion-select>
                </ion-item>
            }

            <ion-item class="item-input">
                <label class="input-archivo">
                    Foto de perfil
                    <input
                        type="file"
                        accept="image/*"
                        (change)="onFotoSeleccionada($event)"
                    />
                </label>
            </ion-item>

            <ion-item class="item-input">
                <ion-input
                    formControlName="password"
                    errorText="La contraseña debe tener al menos 8 caracteres"
                    [class.ion-invalid]="hayError('password', 'required') || hayError('password', 'minlength')"
                    [class.ion-touched]="hayError('password', 'required') || hayError('password', 'minlength')"
                    label="Contraseña"
                    labelPlacement="floating"
                    type="password"
                >
                    <ion-input-password-toggle
                        show-icon="eye-off"
                        hide-icon="eye"
                        color="light"
                        slot="end"
                    ></ion-input-password-toggle>
                </ion-input>
            </ion-item>

            <ion-item>
                <ion-input
                    formControlName="confirmPassword"
                    errorText="Las contraseñas no coinciden"
                    [class.ion-invalid]="passwordsNoCoinciden"
                    [class.ion-touched]="passwordsNoCoinciden"
                    label="Confirmar contraseña"
                    labelPlacement="floating"
                    type="password"
                >
                    <ion-input-password-toggle
                        show-icon="eye-off"
                        hide-icon="eye"
                        color="light"
                        slot="end"
                    ></ion-input-password-toggle>
                </ion-input>
            </ion-item>

            <ion-button expand="full" fill="outline" type="submit" class="boton-primario"
                >Registrarse</ion-button
            >
        </form>
    </ion-card-content>
</ion-card>
