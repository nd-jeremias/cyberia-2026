<div class="pantalla-anonimo">
    <header class="cabecera">
        <div class="isotipo-icono">
            <img src="../../../assets/logo.png">
        </div>
        <h1>Ingreso anónimo</h1>
    </header>

    <section class="seccion-form">
        <form [formGroup]="formulario" (ngSubmit)="onRegistrar()">
            <!-- Campo Nombres -->
            <div class="grupo-input">
                <label class="input-label">Nombres</label>
                <div class="caja-input">
                    <ion-input
                        formControlName="nombres"
                        type="text"
                        label="Nombre"
                        labelPlacement="floating"
                        placeholder="Juan"
                    ></ion-input>
                </div>
                @if (formulario.get("nombres")?.errors?.["required"] && formulario.get("nombres")?.touched) {
                <span class="mensaje-error">Debe ingresar su/s nombre/s</span>
                }
            </div>

            <div class="img-preview">
                <app-subida-imagenes
                    [label]="'Foto de perfil'"
                    [maxImages]="1"
                    (imagenesChange)="recibirImagenes($event)"
                    [modoCamara]="'camara'"
                    [direccionCamara]="direccionCamara()"
                >
                </app-subida-imagenes>
                @if (formulario.get("foto")?.errors?.["minLengthArray"] && formulario.get("foto")?.touched) {
                <span class="mensaje-error">Debe tomar una foto para poder ingresar.</span>
                }
            </div>

            <!-- <div class="bloque-foto">
                <div class="contenedor-foto">
                    @if (foto(); as fotoTomada) {
                        <img
                            class="foto-previa"
                            [src]="fotoTomada.previewUrl"
                            alt="Foto del cliente anónimo"
                        />
                    } @else {
                        <div class="foto-ausente">
                            <ion-icon name="camera"></ion-icon>
                            <span>Todavía no tomaste tu foto</span>
                        </div>
                    }
                </div>

                <button
                    expand="block"
                    fill="outline"
                    type="button"
                    (click)="onTomarFoto()"
                    class="btn-secundario"
                >
                    <ion-icon slot="start" name="camera"></ion-icon>
                    @if (foto()) {
                        Tomar otra foto
                    } @else {
                        Tomar foto
                    }
                </button>
            </div> -->

            <button expand="block" type="submit" class="btn-principal"
                >Ingresar al local</button
            >
        </form>
    </section>
</div>
